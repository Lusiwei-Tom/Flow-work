spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flowwork?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 数据库初始化：首次部署或需要重置数据时改为 always（会 DROP 重建全部表）
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  # Spring AI：DeepSeek（OpenAI 兼容协议）
  # 建议优先用环境变量 DEEPSEEK_API_KEY，yml 内默认值仅用于本地开发
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.3
    vectorstore:
      # 内存向量存储（零外部依赖，重启丢失）；生产可替换为 milvus starter
      simple:
        initialize-schema: true

logging:
  level:
    com.flowwork: debug
